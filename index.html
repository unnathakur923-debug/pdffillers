    <!-- Structured Data (Schema.org: WebApplication, Organization, HowTo, FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "DocuFill Studio",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "All",
            "description": "Browser-based PDF form filler and document preparation guide for SBI Peek Karj Magni crop loan sets, Bank of Maharashtra and SBI account opening forms, Debit Card Form AR-35, and 51 official bank application letters.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "INR"
            },
            "publisher": {
              "@type": "Organization",
              "name": "Thakur Xerox",
              "contactPoint": {
                "@type": "ContactPoint",
                "telephone": "+91-9970996060",
                "contactType": "customer service",
                "areaServed": "IN",
                "availableLanguage": ["English", "Marathi", "Hindi"]
              }
            }
          },
          {
            "@type": "HowTo",
            "name": "How to Fill and Print Banking & Crop Loan PDF Forms Online",
            "description": "Step-by-step instructions to prepare box-aligned banking and Marathi agricultural loan forms locally in your browser.",
            "step": [
              {
                "@type": "HowToStep",
                "name": "Choose the Official Form or Bank Letter Format",
                "text": "Select SBI Peek Karj Magni, BOM Account Opening, SBI Account Opening, Mahabank Debit Card AR-35, or one of 51 Bank Application Letters."
              },
              {
                "@type": "HowToStep",
                "name": "Enter Applicant Details with Marathi Support",
                "text": "Fill structured input fields using English or automatic phonetic English-to-Marathi Devanagari transliteration."
              },
              {
                "@type": "HowToStep",
                "name": "Verify Real-Time Alignment in Live PDF Preview",
                "text": "Check every page in the preview viewer to confirm letters fit boxes and rest cleanly above printed lines."
              },
              {
                "@type": "HowToStep",
                "name": "Download A4 PDF Locally",
                "text": "Export the print-ready PDF directly inside your browser with zero server upload."
              },
              {
                "@type": "HowToStep",
                "name": "Print at 100% Scale and Sign Physically",
                "text": "Print on A4 paper at Actual Size (100% scale), sign physically with pen, attach self-attested KYC or 7/12 copies, and submit at your branch."
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Is my Aadhaar, PAN, bank account number, or photo uploaded to any server?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. DocuFill Studio runs 100% locally inside your web browser. Your entered form fields, passport photos, and generated PDFs never leave your device."
                }
              },
              {
                "@type": "Question",
                "name": "How does English-to-Marathi typing work on the SBI Peek Karj Magni form?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Built-in phonetic transliteration converts English farmer names, villages, crops, and boundary text into clean Marathi Devanagari script aligned above every printed line."
                }
              },
              {
                "@type": "Question",
                "name": "What print settings prevent box or line misalignment on multi-page CIF forms?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Select Paper Size A4 and Scale 100% (Actual Size) in your print dialog rather than Shrink to Fit so character spacing matches printed optical boxes."
                }
              }
            ]
          }
        ]
      }
